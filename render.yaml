services:
  - type: web
    name: farmpulse-malawi
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python seed_miriam_chiphaka.py && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: "True"

