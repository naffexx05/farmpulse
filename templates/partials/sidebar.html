<!-- Mobile backdrop -->
<div
  id="sidebar-backdrop"
  class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"
  onclick="closeSidebar()"
></div>

<aside
  id="sidebar"
  class="fixed inset-y-0 left-0 z-40 w-64 flex flex-col
         bg-forest-950 border-r border-white/5
         transform -translate-x-full lg:translate-x-0 transition-transform duration-200"
>

  <!-- Logo -->
  <div class="px-5 py-6 border-b border-white/5 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-leaf text-forest-900 flex items-center justify-center">
        <i data-lucide="sprout" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="font-display font-semibold text-cream leading-tight">FarmPulse</div>
        <div class="text-[10px] uppercase tracking-widest text-muted">Malawi</div>
      </div>
    </a>
    <button
      class="lg:hidden fp-btn-ghost !px-2 !py-1.5"
      onclick="closeSidebar()"
      aria-label="Close menu"
    >
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1 text-sm">
    <a href="{% url 'home' %}" class="fp-nav-item {% if active_nav == 'overview' %}fp-nav-item-active{% endif %}">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
    </a>
    <a href="{% url 'farms:my_farm' %}" class="fp-nav-item {% if active_nav == 'my_farm' %}fp-nav-item-active{% endif %}">
      <i data-lucide="map-pin" class="w-4 h-4"></i> My Farm
    </a>
    <a href="{% url 'farms:farm_history' %}" class="fp-nav-item {% if active_nav == 'farm_history' %}fp-nav-item-active{% endif %}">
      <i data-lucide="history" class="w-4 h-4"></i> Farm History
    </a>
    <a href="{% url 'climate:dashboard' %}" class="fp-nav-item {% if active_nav == 'climate' %}fp-nav-item-active{% endif %}">
      <i data-lucide="cloud-sun" class="w-4 h-4"></i> Climate Intelligence
    </a>
    <a href="{% url 'market:dashboard' %}" class="fp-nav-item {% if active_nav == 'market' %}fp-nav-item-active{% endif %}">
      <i data-lucide="trending-up" class="w-4 h-4"></i> Market Intelligence
    </a>
    <a href="{% url 'planner:planner_input' %}" class="fp-nav-item {% if active_nav == 'planner' %}fp-nav-item-active{% endif %}">
      <i data-lucide="leaf" class="w-4 h-4"></i> Crop Planner
    </a>
    <a href="{% url 'planner:scenario_simulator' %}" class="fp-nav-item {% if active_nav == 'scenarios' %}fp-nav-item-active{% endif %}">
      <i data-lucide="gamepad-2" class="w-4 h-4 text-amber-400"></i> Scenario Simulator 🎮
    </a>
    <a href="{% url 'planner:plan_list' %}" class="fp-nav-item {% if active_nav == 'plans' %}fp-nav-item-active{% endif %}">
      <i data-lucide="bookmark" class="w-4 h-4"></i> My Plans
    </a>
    <a href="{% url 'farms:season_review_index' %}" class="fp-nav-item {% if active_nav == 'season_review' %}fp-nav-item-active{% endif %}">
      <i data-lucide="clipboard-check" class="w-4 h-4"></i> Season Review
    </a>

    <!-- Innovation Lab Showcase -->
    <div class="pt-3 pb-1 px-1">
      <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-leaf/80 px-2 mb-1">
        <span>Innovation Lab</span>
        <span class="bg-leaf/20 text-leaf px-1.5 py-0.5 rounded text-[9px] font-semibold">Flagship</span>
      </div>
    </div>
    <a href="{% url 'innovation:satellite_twin' %}" class="fp-nav-item {% if active_nav == 'satellite_twin' %}fp-nav-item-active{% endif %}">
      <i data-lucide="satellite" class="w-4 h-4 text-sky-400"></i> Satellite Field Twin
    </a>
    <a href="{% url 'innovation:ussd_simulator' %}" class="fp-nav-item {% if active_nav == 'ussd_simulator' %}fp-nav-item-active{% endif %}">
      <i data-lucide="phone" class="w-4 h-4 text-emerald-400"></i> USSD *384# Terminal
    </a>
    <a href="{% url 'innovation:parametric_insurance' %}" class="fp-nav-item {% if active_nav == 'parametric_insurance' %}fp-nav-item-active{% endif %}">
      <i data-lucide="shield-check" class="w-4 h-4 text-amber-400"></i> Parametric Insurance
    </a>
    <a href="{% url 'innovation:mlimi_advisor' %}" class="fp-nav-item {% if active_nav == 'mlimi_advisor' %}fp-nav-item-active{% endif %}">
      <i data-lucide="bot" class="w-4 h-4 text-purple-400"></i> Mlimi AI (Chichewa)
    </a>

    <a href="{% url 'settings_index' %}" class="fp-nav-item {% if active_nav == 'settings' %}fp-nav-item-active{% endif %}">
      <i data-lucide="settings" class="w-4 h-4"></i> Settings
    </a>
  </nav>

  <!-- Dev link -->
  <div class="px-3 pb-3">
    <a href="{% url 'design_preview' %}" class="fp-nav-item text-xs text-leaf">
      <i data-lucide="palette" class="w-4 h-4"></i> Design tokens (dev)
    </a>
  </div>

</aside>
