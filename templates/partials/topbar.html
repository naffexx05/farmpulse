<header class="sticky top-0 z-30 bg-forest-900/70 backdrop-blur-xl border-b border-white/5">
  <div class="flex items-center gap-3 sm:gap-4 px-4 sm:px-6 lg:px-8 h-16">

    <!-- Mobile menu trigger -->
    <button
      class="lg:hidden fp-btn-ghost !px-2.5 !py-2"
      onclick="openSidebar()"
      aria-label="Open menu"
    >
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Search -->
    <div class="relative flex-1 max-w-md">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-cream/40"></i>
      <input
        type="search"
        placeholder="Search crops, plans, markets…"
        class="fp-input pl-9"
        aria-label="Search"
      >
    </div>

    <!-- Demo indicator -->
    <span class="fp-demo-pill hidden sm:inline-flex">
      <i data-lucide="flask-conical" class="w-3 h-3"></i> Demo data
    </span>

    <!-- Notifications -->
    <button class="fp-btn-ghost !px-2.5 !py-2 relative" aria-label="Notifications" disabled title="Coming soon">
      <i data-lucide="bell" class="w-5 h-5"></i>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-risk-medium"></span>
    </button>

    <!-- User dropdown -->
    <div class="relative" id="user-menu-wrapper">
      <button
        type="button"
        class="flex items-center gap-2.5 pl-2 pr-3 py-1.5 rounded-xl hover:bg-white/5 transition-colors"
        onclick="toggleUserMenu()"
        aria-haspopup="true"
        aria-expanded="false"
        id="user-menu-button"
      >
        <div class="w-8 h-8 rounded-full bg-leaf text-forest-900 flex items-center justify-center font-semibold text-sm">
          {{ request.user.username|slice:":1"|upper }}
        </div>
        <div class="hidden sm:block text-left">
          <div class="text-xs font-semibold text-cream leading-tight">{{ request.user.username|default:"Guest" }}</div>
          <div class="text-[10px] text-muted leading-tight">Demo farmer</div>
        </div>
        <i data-lucide="chevron-down" class="w-4 h-4 text-cream/50"></i>
      </button>

      <!-- Dropdown -->
      <div
        id="user-menu"
        class="hidden absolute right-0 mt-2 w-52 rounded-xl bg-forest-800 border border-white/10 shadow-lg overflow-hidden z-50"
      >
        <div class="px-4 py-3 border-b border-white/5">
          <div class="text-sm font-semibold text-cream">{{ request.user.username }}</div>
          <div class="text-[11px] text-muted">
            {% if request.user.email %}{{ request.user.email }}{% else %}No email set{% endif %}
          </div>
        </div>
        <a href="{% url 'farms:my_farm' %}" class="block px-4 py-2.5 text-sm text-cream/85 hover:bg-white/5">
          My Farm
        </a>
        <a href="{% url 'design_preview' %}" class="block px-4 py-2.5 text-sm text-cream/85 hover:bg-white/5">
          Design preview
        </a>
        <form method="post" action="{% url 'admin:logout' %}" class="border-t border-white/5">
          {% csrf_token %}
          <button type="submit" class="w-full text-left px-4 py-2.5 text-sm text-risk-high hover:bg-white/5">
            Log out
          </button>
        </form>
      </div>
    </div>

  </div>
</header>
